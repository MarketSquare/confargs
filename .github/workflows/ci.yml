name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin uv for reproducible CI; bump deliberately.
  UV_VERSION: "0.12.7"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      # setup-uv@v3 has no `python-version` input, so uv picks the interpreter
      # from UV_PYTHON (downloading it if needed) for each matrix entry.
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      # Test every supported Python on Linux; on the costlier Windows runners
      # cover only the oldest and newest supported versions.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync (locked)
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov=confargs --cov-report=xml
