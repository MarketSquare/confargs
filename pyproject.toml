[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argconfig"
dynamic = ["version"]
description = "Declarative CLI argument parser that merges command line, TOML config files, and environment variables."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "argconfig contributors" }]
keywords = ["cli", "argparse", "toml", "configuration", "arguments"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/argconfig/argconfig"
Repository = "https://github.com/argconfig/argconfig"
Issues = "https://github.com/argconfig/argconfig/issues"

[project.scripts]
argconfig-demo = "argconfig.demo:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "tomli>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argconfig"]

[tool.hatch.version]
path = "src/argconfig/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/argconfig"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["argconfig"]
branch = true
